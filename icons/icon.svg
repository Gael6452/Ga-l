<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-labelledby="t d">
  <title id="t">TrioInclusion</title>
  <desc id="d">Cerveau schématisé relié par une flèche à une boîte étiquetée IA, sur fond dégradé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#5a3eff"/>
      <stop offset="100%" stop-color="#0d8478"/>
    </linearGradient>
  </defs>

  <!-- Fond carré arrondi (zone sûre maskable : centre dans 80%) -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <g fill="none" stroke="#ffffff" stroke-width="14"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Cerveau (gauche) -->
    <path d="M180 130
             C 110 130, 80 180, 80 230
             C 80 290, 110 340, 180 340
             L 200 340 L 200 130 Z"/>
    <path d="M115 195 C 140 200, 155 210, 160 230"/>
    <path d="M105 270 C 135 260, 160 260, 175 285"/>
    <path d="M165 145 L 165 325"/>

    <!-- Flèche -->
    <line x1="225" y1="235" x2="320" y2="235"/>
    <polyline points="298,210 320,235 298,260"/>

    <!-- Boîte IA (droite) -->
    <rect x="335" y="170" width="135" height="135" rx="22" ry="22"/>
  </g>

  <!-- Texte IA -->
  <text x="402" y="261" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="68" font-weight="800" fill="#ffffff">IA</text>
</svg>
