<?xml version="1.0" encoding="UTF-8"?>
<!--
  Variante maskable : le contenu est réduit à ~70 % et centré, pour rester
  dans la zone sûre lorsque le système Android applique un masque circulaire.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-labelledby="t d">
  <title id="t">TrioInclusion</title>
  <desc id="d">Icône maskable : cerveau relié à une boîte IA, contenu centré dans la zone sûre.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#38d4c5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- Contenu réduit dans la zone sûre (256/512 = 50 %) -->
  <g transform="translate(256 256) scale(0.65) translate(-256 -235)">
    <g fill="none" stroke="#ffffff" stroke-width="20"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M180 130
               C 110 130, 80 180, 80 230
               C 80 290, 110 340, 180 340
               L 200 340 L 200 130 Z"/>
      <path d="M115 195 C 140 200, 155 210, 160 230"/>
      <path d="M105 270 C 135 260, 160 260, 175 285"/>
      <path d="M165 145 L 165 325"/>
      <line x1="225" y1="235" x2="320" y2="235"/>
      <polyline points="298,210 320,235 298,260"/>
      <rect x="335" y="170" width="135" height="135" rx="22" ry="22"/>
    </g>
    <text x="402" y="261" text-anchor="middle"
          font-family="-apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="68" font-weight="800" fill="#ffffff">IA</text>
  </g>
</svg>
